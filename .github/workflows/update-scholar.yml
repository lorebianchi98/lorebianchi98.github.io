name: Update Scholar Stats

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bibtexparser<2.0.0" scholarly

      - name: Fetch Scholar Citations
        run: |
          import json
          import re
          import requests
          from bs4 import BeautifulSoup

          SCHOLAR_ID = "MBTBfJ4AAAAJ"
          url = f"https://scholar.google.com/citations?user={SCHOLAR_ID}&hl=en"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9"
          }

          citations = 0
          try:
              resp = requests.get(url, headers=headers, timeout=15)
              if resp.status_code == 200:
                  soup = BeautifulSoup(resp.text, "html.parser")
                  # Scholar index table: first td.gsc_rsb_std is "All Citations"
                  stat_td = soup.find("td", class_="gsc_rsb_std")
                  if stat_td:
                      citations = int(stat_td.text.strip().replace(",", ""))
                      print(f"Retrieved citations: {citations}")
                  else:
                      print("Could not find citation counter on page.")
              else:
                  print(f"Scholar returned status {resp.status_code}")
          except Exception as e:
              print(f"Scrape error: {e}")

          # Preserve existing citations if blocked
          if citations == 0:
              try:
                  with open("stats.json", "r") as f:
                      citations = json.load(f).get("citations", 0)
              except Exception:
                  pass

          with open("stats.json", "w") as f:
              json.dump({"citations": citations}, f, indent=2)

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update scholar citations" && git push)